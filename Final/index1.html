<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wildfire in the PNW</title>
  <script src="https://api.mapbox.com/mapbox-gl-js/v3.24.0/mapbox-gl.js"></script>
  <link href="https://api.mapbox.com/mapbox-gl-js/v3.24.0/mapbox-gl.css" rel="stylesheet" />
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0f0f0f;
      font-family: 'Courier Prime', monospace;
    }

    #map {
      position: absolute;
      inset: 0;
    }

    .sidebar {
      position: absolute;
      top: 20px;
      left: 20px;
      z-index: 2;
      width: 260px;
      padding: 12px 14px;
      color: #fff;
      background: rgba(0, 0, 0, 0.62);
      border: 1px solid rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(4px);
    }

    .title {
      margin-bottom: 10px;
      color: #ff4444;
      font-family: 'Poppins', system-ui, sans-serif;
      font-size: 22px;
      font-weight: 900;
      line-height: 1.05;
      letter-spacing: -0.5px;
      text-transform: uppercase;
    }

    .year-section {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .year-label {
      font-size: 10px;
      color: #aaa;
      text-transform: uppercase;
      letter-spacing: 1px;
      font-weight: 700;
    }

    .year-slider {
      width: 100%;
      -webkit-appearance: none;
      appearance: none;
      height: 3px;
      border-radius: 999px;
      background: rgba(255, 68, 68, 0.25);
      outline: none;
    }

    .year-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #ff4444;
      cursor: grab;
      box-shadow: 0 0 8px rgba(255, 68, 68, 0.4);
    }

    .year-slider::-moz-range-thumb {
      width: 12px;
      height: 12px;
      border: 0;
      border-radius: 50%;
      background: #ff4444;
      cursor: grab;
      box-shadow: 0 0 8px rgba(255, 68, 68, 0.4);
    }

    .year-display {
      font-size: 12px;
      color: #ddd;
      display: flex;
      justify-content: space-between;
    }

    .year-marks {
      display: flex;
      justify-content: space-between;
      font-size: 9px;
      color: #777;
    }

    .hint {
      position: absolute;
      right: 20px;
      top: 20px;
      z-index: 2;
      max-width: 320px;
      padding: 12px 14px;
      color: #fff;
      background: rgba(0, 0, 0, 0.62);
      border: 1px solid rgba(255, 255, 255, 0.08);
      font-size: 13px;
      line-height: 1.4;
    }

    /* Popup styles intentionally omitted while the map is being stabilized. */
  </style>
</head>
<body>
  <div id="map"></div>

  <div class="sidebar">
    <div class="title">wildfire<br />in the pnw</div>
    <div class="year-section">
      <label class="year-label" for="yearSlider">drag to shift years</label>
      <input type="range" min="1980" max="2025" value="2022" class="year-slider" id="yearSlider" />
      <div class="year-display">
        <span>Year</span>
        <span id="yearValue">2022</span>
      </div>
      <div class="year-marks">
        <span>1980</span>
        <span>1995</span>
        <span>2010</span>
        <span>2025</span>
      </div>
    </div>
  </div>

  <div class="hint">
    Open with <code>?tileset=username.tilesetid&amp;source-layer=layername</code>.
    The slider is display-only; it does not filter the map.
  </div>

  <script>
    mapboxgl.accessToken = 'pk.eyJ1IjoiYmVuYWxkcjMiLCJhIjoiY21uaHg5YnIyMDdlbzJycTRtY2R2aGRrYyJ9.sqoJ4mnoaaRnjwBUMLJitw';

    const params = new URLSearchParams(window.location.search);
    const tilesetId = (params.get('tileset') || 'benaldr3.ce3ktv16').trim();
    const sourceLayer = (params.get('source-layer') || params.get('layer') || 'data').trim();
    const map = new mapboxgl.Map({
      container: 'map',
      style: 'mapbox://styles/mapbox/dark-v11',
      center: [-120.5, 45.5],
      zoom: 6
    });

    map.addControl(new mapboxgl.NavigationControl({ showCompass: false }), 'bottom-left');

    const yearSlider = document.getElementById('yearSlider');
    const yearValue = document.getElementById('yearValue');
    yearSlider.addEventListener('input', (e) => {
      yearValue.textContent = e.target.value;
    });

    const demoData = {
      type: 'FeatureCollection',
      features: [
        {
          type: 'Feature',
          properties: { name: 'Demo Fire A' },
          geometry: {
            type: 'Polygon',
            coordinates: [[[-120.8, 45.2], [-120.2, 45.2], [-120.2, 45.7], [-120.8, 45.7], [-120.8, 45.2]]]
          }
        },
        {
          type: 'Feature',
          properties: { name: 'Demo Fire B' },
          geometry: {
            type: 'Polygon',
            coordinates: [[[-121.5, 45.9], [-121.0, 45.9], [-121.0, 46.25], [-121.5, 46.25], [-121.5, 45.9]]]
          }
        }
      ]
    };

    function addLayersToMap(layerName) {
      if (!map.getLayer('wildfire-fill')) {
        map.addLayer({
          id: 'wildfire-fill',
          type: 'fill',
          source: 'wildfires',
          ...(layerName ? { 'source-layer': layerName } : {}),
          paint: {
            'fill-color': '#cc4444',
            'fill-opacity': 0.6
          }
        });
      }

      if (!map.getLayer('wildfire-outline')) {
        map.addLayer({
          id: 'wildfire-outline',
          type: 'line',
          source: 'wildfires',
          ...(layerName ? { 'source-layer': layerName } : {}),
          paint: {
            'line-color': '#ffb3b3',
            'line-width': 1.5,
            'line-opacity': 0.8
          }
        });
      }

      map.on('mouseenter', 'wildfire-fill', () => {
        map.getCanvas().style.cursor = 'pointer';
      });

      map.on('mouseleave', 'wildfire-fill', () => {
        map.getCanvas().style.cursor = '';
      });

      map.on('click', 'wildfire-fill', (e) => {
        const props = (e.features && e.features[0] && e.features[0].properties) || {};
        const title = props.name || props.title || props.id || 'Feature';
        new mapboxgl.Popup({ offset: 20 })
          .setLngLat(e.lngLat)
          .setHTML(`<strong>${title}</strong>`)
          .addTo(map);
      });
    }

    map.on('load', () => {
      const tilesetUrl = `mapbox://${tilesetId}`;
      let usedFallback = false;

      const loadDemoFallback = () => {
        if (usedFallback) return;
        usedFallback = true;

        try {
          if (map.getLayer('wildfire-fill')) map.removeLayer('wildfire-fill');
          if (map.getLayer('wildfire-outline')) map.removeLayer('wildfire-outline');
          if (map.getSource('wildfires')) map.removeSource('wildfires');
        } catch (err) {
          console.warn('Cleanup before fallback failed:', err);
        }

        map.addSource('wildfires', {
          type: 'geojson',
          data: demoData
        });
        addLayersToMap();
      };

      if (!tilesetId) {
        map.addSource('wildfires', {
          type: 'geojson',
          data: demoData
        });
        addLayersToMap();
        return;
      }

      map.addSource('wildfires', {
        type: 'vector',
        url: tilesetUrl
      });

      const onSourceData = (e) => {
        if (e.sourceId !== 'wildfires' || !e.isSourceLoaded) return;
        map.off('sourcedata', onSourceData);
        try {
          addLayersToMap(sourceLayer);
        } catch (err) {
          console.warn('Tileset layer add failed, switching to demo data:', err);
          loadDemoFallback();
        }
      };

      map.on('sourcedata', onSourceData);

      setTimeout(() => {
        if (!map.getLayer('wildfire-fill')) {
          console.warn('Tileset did not render; using demo fallback.');
          loadDemoFallback();
        }
      }, 7000);
    });
  </script>
</body>
</html>
