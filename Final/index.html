<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Wildfire in the PNW</title>
    <meta
            name="viewport"
            content="initial-scale=1,maximum-scale=1,user-scalable=no"
    />
    <script src="https://api.mapbox.com/mapbox-gl-js/v3.24.0/mapbox-gl.js"></script>
    <link
      href="https://api.tiles.mapbox.com/mapbox-gl-js/v3.24.0/mapbox-gl.css"
      rel="stylesheet"
    />
  </head>

  <style>
    body {
      margin: 0;
      padding: 0;
    }
    #map {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 100%;
    }
  </style>

  <body>
    <div id="map"></div>

    <script>
      mapboxgl.accessToken =
        'pk.eyJ1IjoiYmVuYWxkcjMiLCJhIjoiY21uaHg5YnIyMDdlbzJycTRtY2R2aGRrYyJ9.sqoJ4mnoaaRnjwBUMLJitw';

      const map = new mapboxgl.Map({
        container: 'map', // id of a div on your page, where the map will be inserted
        style: 'mapbox://styles/mapbox/dark-v11', // stylesheet location
        center: [-120.5, 45.5], // starting position [lng, lat] e.g. [-122.6788, 45.5212]
        zoom: 6, // starting zoom
      });
      map.addControl(
              new mapboxgl.NavigationControl({
                showCompass: false,
              }),
              'bottom-left',
      );
      let hoveredPolygonId = null;

      map.on('load', () => {
        map.addSource('fires', {
          'type': 'tileset',
          'data': 'https://console.mapbox.com/studio/tilesets/benaldr3.ce3ktv16',
        });
        map.addLayer({
          'id': 'poly_Acres',
          'type': 'fill',
          'source': 'poly_Incid',
          'layout': {},
          'paint': {
            'fill-color': '#627BC1',
            'fill-opacity': [
              'case',
              ['boolean', ['feature-state', 'hover'], false],
              1,
              0.5
            ]
          }
        });

        map.addLayer({
          'id': 'poly_Incid',
          'type': 'line',
          'source': 'poly_Polyg',
          'layout': {},
          'paint': {
            'line-color': '#627BC1',
            'line-width': 2
          }
        });
      });
    </script>
  </body>
</html>
